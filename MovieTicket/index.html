<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="spotify.png" type="image/x-icon">
</head>

<body>
    <!--Contenedor principal del boleto-->
    <div class="ticket">
        <!--parte superior del boleto-->
        <div class="top">
            <!--titulo de la pelicula-->
            <h2>Cinema</h2>
            <!--subtitulo de la pelicula-->
            <div class="movie-title">CS film</div>
        </div>
        <!--Parte inferior del boleto-->
        <div class="bottom">
            <!--informacion de la fecha-->
            <div clas="info">
                <div>DATE</div>
                <span>SEP 28</span>
            </div>
            <!--Informacion de la hora-->
            <div class="info" style="text-align: center;">
                <div>TIME</div>
                <span>20:00</span>
            </div>
            <!-- Informacion de asiento -->
            <div class="info" style="text-align: right;">
                <div>SEAT</div>
                <span>A12</span>
            </div>
        </div>
    </div>
</body>

</html>
